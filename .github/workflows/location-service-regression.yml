name: Location service emulator regression

on:
  push:
    branches: [fix/real-device-location-v1.1.2]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/location-service-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: location-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM for the hosted emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Unit tests and lint
        run: bash ./gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8' :app:testDebugUnitTest :app:lintDebug
      - name: API 35 service regression (not physical acceptance)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8' :app:connectedDebugAndroidTest
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: location-service-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
