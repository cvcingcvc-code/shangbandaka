<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fafafa; }
  #map { width: 100%; height: 100%; }
  #hint {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(21,101,192,0.9); color: #fff; font-size: 12px;
    padding: 4px 12px; border-radius: 12px; z-index: 1000; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="hint">点击地图选择位置</div>
<div id="map"></div>
<script>
  var map = L.map('map', { zoomControl: true }).setView([39.908722, 116.397499], 14);
  var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var marker = null;
  var selectionId = 0;
  var selectionTimer = null;
  window.refreshMap = function() { map.invalidateSize({animate: false}); };
  window.clearSelection = function() {
    clearTimeout(selectionTimer);
    selectionId = 0;
    if (marker) { map.removeLayer(marker); marker = null; }
  };
  // Manual map mode also needs an actionable error if no tile ever loads.
  setTimeout(function() {
    if (!selectionId && !map.getContainer().querySelector('img.leaflet-tile-loaded') && window.AndroidBridge) {
      AndroidBridge.onMapUnavailable(0);
    }
  }, 10000);
  // Confirmation is enabled only after the map tile containing the selected
  // point is visibly loaded. A network error never masquerades as a map check.
  function checkSelectedTile() {
    if (!selectionId || !marker) return;
    var point = map.latLngToContainerPoint(marker.getLatLng());
    var bounds = map.getContainer().getBoundingClientRect();
    var x = bounds.left + point.x, y = bounds.top + point.y;
    var loaded = Array.from(map.getContainer().querySelectorAll('img.leaflet-tile-loaded'))
      .some(function(img) {
        var r = img.getBoundingClientRect();
        return img.complete && img.naturalWidth > 0 && x >= r.left && x < r.right && y >= r.top && y < r.bottom;
      });
    if (loaded) {
      clearTimeout(selectionTimer);
      var id = selectionId;
      selectionId = 0;
      if (window.AndroidBridge) AndroidBridge.onMapReady(id);
    }
  }
  tiles.on('tileload', function() { requestAnimationFrame(checkSelectedTile); });
  map.on('click', function(e) {
    var lat = e.latlng.lat, lng = e.latlng.lng;
    if (marker) { marker.setLatLng(e.latlng); }
    else { marker = L.marker(e.latlng).addTo(map); }
    // 回传给 Android（WGS-84，OSM 原生坐标系）
    if (window.AndroidBridge && AndroidBridge.onMapClick) {
      AndroidBridge.onMapClick(lat, lng);
    }
  });

  // 供外部设置中心点（搜索结果/初始坐标）
  window.setCenter = function(lat, lng, id, keepZoom) {
    map.invalidateSize({animate: false});
    map.setView([lat, lng], keepZoom ? map.getZoom() : 16);
    if (id) {
      if (marker) { marker.setLatLng([lat, lng]); }
      else { marker = L.marker([lat, lng]).addTo(map); }
    } else {
      window.clearSelection();
    }
    clearTimeout(selectionTimer);
    selectionId = id || 0;
    if (selectionId) {
      selectionTimer = setTimeout(function() {
        if (selectionId && window.AndroidBridge) AndroidBridge.onMapUnavailable(selectionId);
        selectionId = 0;
      }, 10000);
      requestAnimationFrame(checkSelectedTile);
    }
  };
</script>
</body>
</html>
